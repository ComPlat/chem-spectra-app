[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "chem-spectra-app"
version = "1.5.1"
requires-python = ">= 3.12"
description = "A backend service to process files obtained from chemical spectroscopy."
license = "MIT"
readme = "README.md"
keywords = ["chemistry", "spectra", "analysis"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux"
]
dependencies = [
  "flask==2.*",
  "gunicorn==22.*",
  "matplotlib==3.*",
  "netCDF4==1.*",
  "numpy>=2.0,<2.4",
  "pymzml==2.*",
  "requests==2.*",
  "rdkit==2025.*",
  "setuptools>=80,<84",
  "werkzeug==3.*",
  "scipy==1.*",
  "pyopenms==3.*",
  "nmrglue@git+https://github.com/ComPlat/nmrglue.git@b0802a080b44de6bb75fd294e8d14cb4b24b95e9",
]

[project.optional-dependencies]
# prod is the production installation till https://github.com/pypa/pip/issues/11440 gets solved
dev = [
    "coverage",
    "pytest"
]

[project.urls]
homepage = "https://chemotion.net/docs/services/chemspectra"
repository = "https://github.com/ComPlat/chem-spectra-app"

[tool.setuptools]
py-modules = []
